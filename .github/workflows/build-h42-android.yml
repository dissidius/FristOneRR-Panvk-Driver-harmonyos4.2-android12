name: Build FristOneRR H42 Android driver ZIPs
on:
  push:
    branches: [harmony42-android-build]
    paths:
      - '.github/workflows/build-h42-android.yml'
      - 'scripts/build-h42-android.sh'
      - 'ci/**'
      - 'patches/0001-huawei-kirin990-jm-mem-import-32.patch'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fristone-h42-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout compatibility fork
        uses: actions/checkout@v4
        with:
          path: h42
      - name: Restore pinned FristOneRR source
        id: mesa-source
        uses: actions/cache/restore@v4
        with:
          path: mesa
          key: h42-frist-mesa-v1-efd07bab401b263a9ac114560ecdb9a2934f5d43
      - name: Checkout pinned FristOneRR Mesa source
        if: steps.mesa-source.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: FristOneRR-Admin/FristOneRR-Panvk-Source
          ref: efd07bab401b263a9ac114560ecdb9a2934f5d43
          path: mesa
      - name: Cache clean source before applying patches
        if: steps.mesa-source.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: mesa
          key: h42-frist-mesa-v1-efd07bab401b263a9ac114560ecdb9a2934f5d43
      - name: Apply verified Huawei compatibility patch
        run: |
          set -euo pipefail
          cd mesa
          git apply --check ../h42/patches/0001-huawei-kirin990-jm-mem-import-32.patch
          git apply ../h42/patches/0001-huawei-kirin990-jm-mem-import-32.patch
          git diff --check
      - name: Restore Ubuntu and Python dependency cache
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            .ci-apt
            .ci-venv
          key: h42-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('h42/ci/h42-apt.txt', 'h42/ci/h42-python.txt') }}
      - name: Restore incremental compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-ccache
          key: h42-ccache-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            h42-ccache-v1-${{ runner.os }}-
      - name: Reuse cached tools, install only missing dependencies
        timeout-minutes: 7
        run: bash h42/ci/h42-setup.sh h42
      - name: Save prepared dependency cache
        if: success() && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .ci-apt
            .ci-venv
          key: h42-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('h42/ci/h42-apt.txt', 'h42/ci/h42-python.txt') }}
      - name: Build native shader tools and Android driver
        timeout-minutes: 26
        env:
          CC: clang-18
          CXX: clang++-18
          LLVM_CONFIG: llvm-config-18
        run: |
          set -euo pipefail
          bash h42/scripts/build-h42-android.sh mesa "$ANDROID_HOME/ndk/29.0.14206865"
      - name: Report compiler cache hit rate
        if: always()
        run: command -v ccache >/dev/null 2>&1 && ccache --show-stats || true
      - name: Save updated compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ci-ccache
          key: h42-ccache-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload Android driver ZIPs and SHA256 checksums
        uses: actions/upload-artifact@v4
        with:
          name: FristOneRR-H42-Android-EXPERIMENTAL
          path: |
            dist/*EXPERIMENTAL.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload build logs if compilation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FristOneRR-H42-build-logs
          path: |
            mesa/build-h42-host/meson-logs/
            mesa/build-h42-android/meson-logs/
          if-no-files-found: ignore
          retention-days: 7
